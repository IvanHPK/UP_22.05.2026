<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Данные о сотрудниках</title>

    <style>
        :root {
            --bg: #111111;
            --text: #ffffff;
            --panel: #333333;
            --field: #3b3b3b;
            --border: #555555;

            --btn-save: #16a34a;
            --btn-save-hover: #15803d;

            --btn-delete: #1f1f1f;
            --btn-delete-text: #cfcfcf;
            --btn-delete-hover: #2a2a2a;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f4f4f4;
                --text: #111111;
                --panel: #dddddd;
                --field: #ffffff;
                --border: #b8b8b8;

                --btn-save: #15803d;
                --btn-save-hover: #166534;

                --btn-delete: #eeeeee;
                --btn-delete-text: #444444;
                --btn-delete-hover: #dddddd;
            }
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .top {
            border-bottom: 1px solid var(--border);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top a {
            color: var(--text);
            text-decoration: none;
            font-size: 28px;
        }

        .box {
            width: 90%;
            max-width: 1250px;
            background: var(--panel);
            margin: 70px auto;
            padding: 45px 35px;
            min-height: 650px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .row {
            display: grid;
            grid-template-columns: 1.3fr 1.3fr 1fr 120px 135px;
            gap: 12px;
            align-items: center;
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: var(--field);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 14px 12px;
            font-size: 16px;
            min-width: 0;
        }

        input[readonly] {
            opacity: 0.9;
        }

        .btn {
            width: 100%;
            box-sizing: border-box;
            border: none;
            border-radius: 18px;
            padding: 9px 12px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }

        .btn-save {
            background: var(--btn-save);
            color: white;
        }

        .btn-save:hover {
            background: var(--btn-save-hover);
        }

        .btn-delete {
            background: var(--btn-delete);
            color: var(--btn-delete-text);
            border: 1px solid var(--border);
        }

        .btn-delete:hover {
            background: var(--btn-delete-hover);
        }

        .empty {
            font-size: 20px;
            color: var(--text);
        }
    </style>
</head>
<body>

<div class="top">
    <a href="/admin-panel/">Назад</a>
    <h2>Данные о сотрудниках</h2>
</div>

<div class="box">
    {% for employee in employees %}
    <form method="post" class="row">
        {% csrf_token %}

        <input type="hidden" name="employee_id" value="{{ employee.id }}">

        <input name="username" value="{{ employee.username }}">
        <input name="email" value="{{ employee.email }}">

        <input value="{% if employee.is_staff %}Сотрудник{% else %}Пользователь{% endif %}" readonly>

        <button name="action" value="update" class="btn btn-save">
            Изменить
        </button>

        <button name="action" value="delete" class="btn btn-delete">
            Удалить запись
        </button>
    </form>
    {% empty %}
    <p class="empty">Сотрудники пока не добавлены.</p>
    {% endfor %}
</div>

</body>
</html>
