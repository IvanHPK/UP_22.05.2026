<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование меню</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }

        .top {
            height: 60px;
            border-bottom: 1px solid black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .top a {
            color: black;
            text-decoration: none;
            font-size: 26px;
        }

        .top h1 {
            font-size: 28px;
            font-weight: normal;
            margin: 0;
        }

        .box {
            width: 85%;
            max-width: 1200px;
            background: #d9d9d9;
            margin: 70px auto;
            padding: 50px 40px;
            min-height: 560px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .text-field {
            width: 230px;
            height: 45px;
            border: none;
            font-size: 20px;
            padding-left: 15px;
            background: white;
        }

        .small-field {
            width: 130px;
            height: 45px;
            border: none;
            font-size: 20px;
            padding-left: 15px;
            background: white;
        }

        .btn {
            border: none;
            border-radius: 20px;
            padding: 8px 30px;
            font-size: 20px;
            cursor: pointer;
        }

        .btn-save {
            background: #16a34a;
            color: white;
        }

        .btn-save:hover { background: #15803d; }

        .btn-delete {
            background: #e5e5e5;
            color: #555;
            border: 1px solid #bbbbbb;
        }

        .btn-delete:hover {
            background: #d4d4d4;
            color: #333;
        }
    </style>
</head>
<body>

<div class="top">
    <a href="/admin-panel/">Назад</a>
    <h1>Редактирование меню</h1>
</div>

<div class="box">

    {% for dish in dishes %}
    <form method="post" class="row">
        {% csrf_token %}

        <input type="hidden" name="dish_id" value="{{ dish.id }}">

        <input class="text-field" type="text" name="name" value="{{ dish.name }}">
        <input class="text-field" type="text" name="description" value="{{ dish.description }}">
        <input class="small-field" type="text" name="price" value="{{ dish.price }}">
        <input class="small-field" type="text" name="status" value="{{ dish.status }}">

        <button class="btn btn-save" type="submit" name="action" value="update">
            Изменить
        </button>

        <button class="btn btn-delete" type="submit" name="action" value="delete">
            Удалить запись
        </button>
    </form>
    {% empty %}
    <p>Блюда пока не добавлены.</p>
    {% endfor %}

</div>

</body>
</html>
