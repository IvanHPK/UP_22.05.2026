<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование заказов</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }

        .top {
            height: 60px;
            border-bottom: 1px solid black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .top a {
            color: black;
            text-decoration: none;
            font-size: 26px;
        }

        .top h1 {
            font-size: 28px;
            font-weight: normal;
            margin: 0;
        }

        .box {
            width: 85%;
            max-width: 1200px;
            background: #d9d9d9;
            margin: 70px auto;
            padding: 50px 40px;
            min-height: 560px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .text-field {
            width: 230px;
            height: 45px;
            border: none;
            font-size: 20px;
            padding-left: 15px;
            background: white;
        }

        .small-field {
            width: 150px;
            height: 45px;
            border: none;
            font-size: 20px;
            padding-left: 15px;
            background: white;
        }

        .btn {
            border: none;
            border-radius: 20px;
            padding: 8px 30px;
            font-size: 20px;
            cursor: pointer;
        }

        .btn-save {
            background: #16a34a;
            color: white;
        }

        .btn-delete {
            background: #e5e5e5;
            color: #555;
            border: 1px solid #bbbbbb;
        }

        .status-new { background: #2563eb; color: white; }
        .status-check { background: #7c3aed; color: white; }
        .status-formed { background: #f59e0b; color: black; }
        .status-cooking { background: #fb923c; color: black; }
        .status-courier { background: #059669; color: white; }
        .status-delivery { background: #06b6d4; color: black; }
        .status-done { background: #16a34a; color: white; }
    </style>
</head>
<body>

<div class="top">
    <a href="/admin-panel/">Назад</a>
    <h1>Редактирование заказов</h1>
</div>

<div class="box">

    {% for order in orders %}
    <form method="post" class="row">
        {% csrf_token %}

        <input type="hidden" name="order_id" value="{{ order.id }}">

        <input class="text-field" type="text" name="client_name" value="{{ order.client.full_name }}">

        <input class="small-field" type="text" name="total_price" value="{{ order.total_price }}">

        <input class="text-field
            {% if order.status == 'Новый' %}status-new
            {% elif order.status == 'Проверен' %}status-check
            {% elif order.status == 'Сформирован' %}status-formed
            {% elif order.status == 'Готовится' %}status-cooking
            {% elif order.status == 'Передан курьеру' %}status-courier
            {% elif order.status == 'В доставке' %}status-delivery
            {% elif order.status == 'Доставлен' %}status-done
            {% endif %}"
            type="text"
            name="status"
            value="{{ order.status }}">

        <button class="btn btn-save" type="submit" name="action" value="update">
            Изменить
        </button>

        <button class="btn btn-delete" type="submit" name="action" value="delete">
            Удалить запись
        </button>
    </form>
    {% empty %}
    <p>Заказов пока нет.</p>
    {% endfor %}

</div>

</body>
</html>
