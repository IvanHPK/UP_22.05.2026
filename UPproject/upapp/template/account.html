<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет клиента</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }

        .top {
            height: 65px;
            border-bottom: 1px solid black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .top a {
            color: black;
            text-decoration: none;
            font-size: 26px;
        }

        .top h1 {
            font-size: 28px;
            font-weight: normal;
            margin: 0;
        }

        .box {
            width: 75%;
            max-width: 950px;
            background: #d9d9d9;
            margin: 70px auto;
            padding: 50px;
            min-height: 500px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 28px;
        }

        input {
            width: 300px;
            height: 45px;
            border: none;
            font-size: 22px;
            padding-left: 15px;
            background: white;
        }

        .btn {
            border: none;
            border-radius: 20px;
            padding: 8px 35px;
            font-size: 22px;
            cursor: pointer;
        }

        .btn-save {
            background: #16a34a;
            color: white;
        }

        .btn-delete {
            background: #eeeeee;
            color: #555;
            border: 1px solid #bbbbbb;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="top">
    <a href="/index/">Назад</a>
    <h1>Личный кабинет клиента</h1>
</div>

<div class="box">
    <form method="post">
        {% csrf_token %}

        <div class="row">
            <input type="text" name="full_name" value="{{ client.full_name }}">
            <button name="action" value="save" class="btn btn-save">Изменить</button>
        </div>

        <div class="row">
            <input type="email" name="email" value="{{ client.email }}">
            <button name="action" value="save" class="btn btn-save">Изменить</button>
        </div>

        <div class="row">
            <input type="text" name="phone" value="{{ client.phone }}">
            <button name="action" value="save" class="btn btn-save">Изменить</button>
        </div>

        <div class="row">
            <input type="text" name="delivery_address" value="{{ client.delivery_address }}">
            <button name="action" value="save" class="btn btn-save">Изменить</button>
        </div>

        <button name="action" value="delete" class="btn btn-delete">
            Удалить учётную запись
        </button>
    </form>
</div>

</body>
</html>
